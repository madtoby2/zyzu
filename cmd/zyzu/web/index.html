<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZYZU Client</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#24102f 0%,#5b174f 52%,#b52f72 100%);color:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#12121e;border:1px solid #222;border-radius:14px;padding:32px;width:380px;max-width:90vw}
.login-box h1{font-size:22px;color:#ec4899;margin-bottom:4px;text-align:center}
.login-box .sub{font-size:12px;color:#444;text-align:center;margin-bottom:24px}
.login-box label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:14px}
.login-box input{width:100%;padding:10px 12px;background:#0a0a10;border:1px solid #333;border-radius:8px;color:#ccc;font-size:14px}
.login-box input:focus{outline:none;border-color:#ec4899}
.login-box .err{color:#ef4444;font-size:12px;margin-top:6px;display:none}
.login-box .btn{width:100%;padding:10px;margin-top:18px;background:#ec4899;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box .btn:hover{background:#db2777}
.saved{margin-top:12px;font-size:12px;color:#333}
.saved span{cursor:pointer;color:#555;margin-right:12px}
.saved span:hover{color:#ec4899}
.app{max-width:1280px;margin:0 auto;padding:24px;width:100%;display:none;background:rgba(18,18,30,.94);min-height:calc(100vh - 32px);border-radius:14px;box-shadow:0 14px 45px #17091f80}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a1a2a}
.topbar h1{font-size:18px;color:#ec4899}.topbar .server{font-size:11px;color:#444}
.topbar button{background:none;border:1px solid #333;color:#666;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.card{background:#1b1b2b;border:1px solid #34344a;border-radius:10px;padding:16px;text-align:left;box-shadow:0 2px 8px #09091255}
.card .n{font-size:26px;font-weight:700}
.card .l{font-size:11px;color:#a4a7b5;margin-top:2px}
.job-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}.job-card{background:#151522;border:1px solid #34344a;border-radius:10px;padding:12px}.job-card h4{font-size:12px;color:#f0abfc;margin-bottom:7px}.job-card .state{font-size:12px;color:#e5e7eb;line-height:1.5}.job-card .meta{font-size:11px;color:#888;margin-top:7px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
 .toolbar input{flex:1;min-width:140px;padding:7px 10px;background:#0f0f1b;border:1px solid #39394d;border-radius:7px;color:#e5e7eb;font-size:13px}
.toolbar input:focus{outline:none;border-color:#ec4899}
.toolbar select{padding:7px 10px;background:#0f0f1b;border:1px solid #39394d;border-radius:7px;color:#e5e7eb;font-size:13px}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 0;color:#a4a7b5;font-size:12px}.pagination button{min-width:72px}
.category-badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#38204f;border:1px solid #a855f7;color:#f0abfc;font-size:11px;font-weight:600;white-space:nowrap}
.health-badge{display:inline-block;min-width:54px;text-align:center;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}.health-good{background:#064e3b;color:#a7f3d0}.health-ok{background:#1e3a8a;color:#bfdbfe}.health-watch{background:#78350f;color:#fde68a}.health-bad{background:#7f1d1d;color:#fecaca}
.btn{padding:7px 14px;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.btn-p{background:#ec4899;color:#fff}.btn-p:hover{background:#db2777}
.btn-g{background:#10b981;color:#fff}.btn-g:hover{background:#059669}
.btn-r{background:#ef4444;color:#fff}.btn-r:hover{background:#dc2626}
 .btn-o{background:transparent;border:1px solid #4b4b63;color:#c4c7d2;font-size:11px;padding:4px 8px}.btn-o:hover{background:#29293d;color:#fff}
 .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid #2b2b3e}
 .tab{background:none;border:none;color:#a4a7b5;padding:8px 16px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.tab.active{color:#ec4899;border-bottom-color:#ec4899}
table{width:100%;border-collapse:collapse;font-size:12px}
 th{text-align:left;padding:8px 10px;background:#151522;border-bottom:1px solid #2b2b3e;color:#a4a7b5;font-weight:600;position:sticky;top:0}
 td{padding:7px 10px;border-bottom:1px solid #242436}
 tr:hover td{background:#1b1b2b}
.blocked{opacity:.35}
.green{color:#10b981}.red{color:#ef4444}
 .config-form{background:#151522;border:1px solid #2d2d41;border-radius:10px;padding:16px;box-shadow:0 2px 12px #09091255}
 .config-form label{display:block;margin-bottom:10px;font-size:12px;color:#b7bac7}
 .config-form input,.config-form textarea,.config-form select{width:100%;margin-top:3px;padding:7px 10px;background:#0f0f1b;border:1px solid #39394d;border-radius:7px;color:#e5e7eb;font-size:13px;font-family:monospace}
.config-form textarea{resize:vertical;min-height:100px}
.channel-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.channel-card{background:#1b1b2b;border:1px solid #34344a;border-radius:9px;padding:12px;color:#ddd;cursor:pointer;transition:.15s}.channel-card:hover{border-color:#ec4899;transform:translateY(-2px);box-shadow:0 5px 16px #ec489933}
.channel-card h4{color:#ec4899;font-size:13px;margin-bottom:8px}.channel-card .channel-id{font-family:monospace;font-size:12px;color:#aaa;word-break:break-all}
.schedule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.schedule-head h3{color:#ec4899;font-size:15px}.schedule-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.schedule-card{background:#1b1b2b;border:1px solid #34344a;border-radius:10px;padding:14px}.schedule-card.disabled{opacity:.55}.schedule-card h4{color:#f0abfc;font-size:13px;margin-bottom:5px}.schedule-content{white-space:pre-wrap;color:#e5e7eb;background:#11111c;border-radius:7px;padding:9px;margin:10px 0;min-height:48px;max-height:110px;overflow:auto;font-size:12px}.schedule-meta{color:#a4a7b5;font-size:11px;line-height:1.7}.schedule-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:#090912aa;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.hidden{display:none}.modal-panel{width:min(680px,100%);max-height:85vh;overflow:auto;background:#151522;border:1px solid #3b3153;border-radius:14px;padding:20px;box-shadow:0 18px 60px #090912cc}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.modal-head h3{color:#ec4899;font-size:17px}.modal-close{background:none;border:0;color:#aaa;font-size:22px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.detail-item{background:#1b1b2b;border-radius:8px;padding:10px}.detail-item small{display:block;color:#888;font-size:11px;margin-bottom:4px}.detail-item b{font-size:13px;color:#eee;word-break:break-all}.detail-section{margin-top:14px}.detail-section h4{font-size:12px;color:#ec4899;margin-bottom:8px}.detail-list{display:grid;gap:6px}.detail-row{background:#1b1b2b;border-radius:7px;padding:8px 10px;font-size:12px;color:#c7c9d3}.empty-detail{color:#888;font-size:12px;padding:8px 0}
.resource-card{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#1b1b2b;border:1px solid #2d2d44;border-radius:8px;padding:8px;cursor:pointer}.resource-card:hover{border-color:#ec4899}.resource-card img{width:54px;height:72px;object-fit:cover;border-radius:6px;background:#080811}.resource-card h5{font-size:12px;color:#eee;margin-bottom:4px}.resource-card small{color:#999;font-size:11px;line-height:1.5}.policy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.policy-grid input,.policy-grid select{width:100%;margin-top:5px;padding:8px 10px;background:#0f0f1b;border:1px solid #39394d;border-radius:7px;color:#e5e7eb}.cover-preview{width:120px;max-height:170px;object-fit:cover;border-radius:8px;background:#080811;float:right;margin-left:12px}
.category-form{display:grid;gap:12px}.category-form label{font-size:12px;color:#b7bac7}.category-form select{width:100%;margin-top:5px;padding:9px 10px;background:#0f0f1b;border:1px solid #39394d;border-radius:7px;color:#e5e7eb;font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.log-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}.log-tools select{background:#0f0f1b;border:1px solid #39394d;color:#ddd;border-radius:6px;padding:5px 8px;font-size:11px}.log-box{background:#0a0a10;border:1px solid #1a1a2a;border-radius:10px;padding:12px;max-height:320px;overflow-y:auto;font-size:12px;font-family:monospace}
.log-box .ts{color:#444}.log-box .ok{color:#10b981}.log-box .err{color:#ef4444}.log-box .info{color:#888}
.log-box .warn{color:#f59e0b}.toast{position:fixed;right:24px;top:24px;z-index:20;min-width:260px;max-width:420px;padding:12px 16px;border-radius:9px;color:#fff;box-shadow:0 8px 28px #090912aa;font-size:13px}.toast.err{background:#b42318}.toast.warn{background:#b54708}.toast.ok{background:#087443}.toast.info{background:#3730a3}
.hidden{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="login-box" id="login">
  <h1>📡 ZYZU Client</h1>
  <div class="sub">连接到 zyzu server</div>
  <label>服务器地址</label>
  <input id="login-server" placeholder="http://your-vps:8080" value="" autofocus>
  <label>API Key</label>
  <input id="login-key" placeholder="your-api-key">
  <div class="err" id="login-err"></div>
  <button class="btn" onclick="doLogin()">连接</button>
  <div class="saved" id="saved-list"></div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div><h1>📡 ZYZU</h1><div class="server" id="app-server">-</div></div>
    <button onclick="logout()">断开</button>
  </div>
  <div class="grid">
    <div class="card"><div class="n" id="s-total">-</div><div class="l">总站点</div></div>
    <div class="card"><div class="n" id="s-blocked">-</div><div class="l">已屏蔽</div></div>
    <div class="card"><div class="n" id="s-posted">-</div><div class="l">已推送</div></div>
    <div class="card"><div class="n" id="s-running">-</div><div class="l">调度状态</div></div>
    <div class="card"><div class="n" id="s-disk">-</div><div class="l">磁盘剩余</div></div>
  </div>
  <div class="job-board" id="channel-job-board"></div>
  <div class="toolbar">
    <input id="search" placeholder="搜索资源站名称或 API..." oninput="stationPage=1;render()">
    <select id="station-category-filter" onchange="render()"><option value="">全部分类</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;color:#666">
      <input type="checkbox" id="show-blocked" onchange="stationPage=1;render()">显示已屏蔽</label>
    <button class="btn btn-p" onclick="api('/api/trigger','POST')">采集</button>
    <button class="btn btn-g" onclick="api('/api/content/trigger','POST')">抓取内容</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('stations')">资源站</button>
    <button class="tab" onclick="switchTab('channels')">频道</button>
    <button class="tab" onclick="switchTab('scheduled')">定时发言</button>
    <button class="tab" onclick="switchTab('config')">配置</button>
    <button class="tab" onclick="switchTab('log')">日志</button>
  </div>
  <div id="tab-stations"><table><thead><tr><th>名称</th><th>分类</th><th>健康</th><th>资源量</th><th>可用率</th><th>响应</th><th>操作</th></tr></thead><tbody id="station-list"></tbody></table><div class="pagination"><button class="btn btn-o" onclick="changeStationPage(-1)">上一页</button><span id="station-page-info">第 1 页</span><button class="btn btn-o" onclick="changeStationPage(1)">下一页</button></div></div>
  <div id="tab-channels" class="hidden">
    <div class="config-form">
      <label>添加频道（分类）<select id="channel-category"><option value="成人">成人</option><option value="综合影视">综合影视</option><option value="电影">电影</option><option value="电视剧">电视剧</option><option value="动漫">动漫</option><option value="综艺">综艺</option><option value="纪录片">纪录片</option></select></label>
      <label>频道 ID<input id="channel-id" type="number" placeholder="-1001234567890"></label>
      <button class="btn btn-g" onclick="addChannel()">添加频道</button>
      <div class="channel-cards" id="channel-cards"><div class="channel-card">正在加载频道...</div></div>
      <small style="display:block;color:#888;margin-top:10px">点击频道卡片进入设置，可查看绑定资源站或删除该频道。</small>
    </div>
  </div>
  <div id="tab-scheduled" class="hidden">
    <div class="config-form">
      <div class="schedule-head"><div><h3>频道定时发言</h3><small style="color:#888">每个频道独立绑定文案和发送时间</small></div><button class="btn btn-p" onclick="openScheduledModal()">添加定时发言</button></div>
      <div class="schedule-cards" id="scheduled-cards"><div class="empty-detail">正在加载...</div></div>
    </div>
  </div>
  <div id="tab-config" class="hidden">
    <div class="config-form">
      <label>Telethon 手机号<input id="telethon-phone" placeholder="+8613812345678"></label>
      <label>登录验证码<input id="telethon-code" placeholder="收到的验证码"></label>
      <label>两步验证密码<input id="telethon-password" type="password"></label>
      <button class="btn btn-o" onclick="telethonRequestCode()">请求验证码</button>
      <button class="btn btn-g" onclick="telethonLogin()">登录 Telethon</button>
      <span id="telethon-status" class="info">未检查</span>
      <label>Bot Token<input id="cfg-token"></label>
      <label>采集计划<input id="cfg-scrape"></label>
      <label>内容计划<input id="cfg-content-cron"></label>
      <label>模式 <select id="cfg-mode"><option value="video">video</option><option value="split">split</option><option value="digest">digest</option></select></label>
      <label>抓取条数<input id="cfg-limit" type="number" value="10"></label>
      <label>默认视频文案（新频道兜底）<textarea id="cfg-video-format" rows="5" placeholder="[资源码] {code}\n{title}\n分类：{category}"></textarea></label>
      <label style="display:flex;align-items:center;gap:8px"><input id="cfg-separate-cover" type="checkbox" style="width:auto"> 使用资源站封面作为视频封面（保留视频预览）</label>
      <small style="display:block;color:#888;margin-top:-6px">每个频道的正式视频文案在“频道”页点击频道卡片单独设置；这里仅作为新频道或未配置频道的兜底。</small>
      <button class="btn btn-p" onclick="saveConfig()">保存</button>
    </div>
  </div>
  <div id="tab-log" class="hidden"><div class="log-tools"><select id="log-filter" onchange="renderLogs()"><option value="all">全部日志</option><option value="info">信息</option><option value="ok">成功</option><option value="warn">警告</option><option value="err">错误</option></select><button class="btn btn-o" onclick="clearLogs()">清空日志</button></div><div class="log-box" id="log-el"></div></div>
</div>
<div class="modal hidden" id="channel-detail-modal" onclick="if(event.target===this)closeChannelDetail()">
  <div class="modal-panel"><div class="modal-head"><h3 id="channel-detail-title">频道设置</h3><button class="modal-close" onclick="closeChannelDetail()">×</button></div><div id="channel-detail-body"></div><div class="modal-actions"><button class="btn btn-r" onclick="deleteChannelFromDetail()">删除此频道</button><button class="btn btn-o" onclick="closeChannelDetail()">关闭</button></div></div>
</div>
<div class="modal hidden" id="resource-modal" onclick="if(event.target===this)closeResourceModal()">
  <div class="modal-panel"><div class="modal-head"><h3 id="resource-title">资源详情</h3><button class="modal-close" onclick="closeResourceModal()">×</button></div><div id="resource-body"></div><div class="modal-actions"><button class="btn btn-o" onclick="closeResourceModal()">关闭</button></div></div>
</div>
<div class="modal hidden" id="category-modal" onclick="if(event.target===this)closeCategoryModal()">
  <div class="modal-panel"><div class="modal-head"><h3>修改资源站分类</h3><button class="modal-close" onclick="closeCategoryModal()">×</button></div>
    <div class="category-form"><label id="category-station-name">资源站</label><label>选择分类<select id="station-category-select"></select></label></div>
    <div class="modal-actions"><button class="btn btn-o" onclick="closeCategoryModal()">取消</button><button class="btn btn-p" onclick="saveStationCategory()">保存分类</button></div>
  </div>
</div>
<div class="modal hidden" id="scheduled-modal" onclick="if(event.target===this)closeScheduledModal()">
  <div class="modal-panel">
    <div class="modal-head"><h3 id="scheduled-modal-title">添加定时发言</h3><button class="modal-close" onclick="closeScheduledModal()">×</button></div>
    <div class="config-form">
      <label>发送到频道<select id="scheduled-channel"></select></label>
      <label>发言文案<textarea id="scheduled-content" rows="7" maxlength="4096" placeholder="输入该频道独立使用的发言内容"></textarea></label>
      <label>发送方式<select id="scheduled-type" onchange="toggleScheduledFields()"><option value="interval">按间隔重复</option><option value="daily">每天固定时间</option></select></label>
      <label id="scheduled-interval-wrap">发送间隔<select id="scheduled-interval"><option value="15">每 15 分钟</option><option value="30">每 30 分钟</option><option value="60">每 1 小时</option><option value="120">每 2 小时</option><option value="360">每 6 小时</option><option value="720">每 12 小时</option><option value="1440">每天</option></select></label>
      <label id="scheduled-daily-wrap" class="hidden">每天发送时间（北京时间）<input id="scheduled-daily-time" type="time" value="09:00"></label>
      <label style="display:flex;align-items:center;gap:8px"><input id="scheduled-enabled" type="checkbox" checked style="width:auto"> 启用这条定时发言</label>
    </div>
    <div class="modal-actions"><button class="btn btn-o" onclick="closeScheduledModal()">取消</button><button class="btn btn-p" onclick="saveScheduledMessage()">保存</button></div>
  </div>
</div>
<div id="toast-area"></div>

<script>
let server='',key='',stations=[],ws,channelMap={},channelIntervals={},channelPolicies={},channelJobs={},scheduledMessages=[],videoFormats={},logEntries=[],stationPage=1,contentPreviews={};
const stationPageSize=10;
const LS='zyzu_profiles', LOG_PREFIX='zyzu_logs:';

function init(){
  const saved=JSON.parse(localStorage.getItem(LS)||'[]');
  const el=document.getElementById('saved-list');
  if(saved.length){
    el.innerHTML='已保存 '+saved.map((p,i)=>`<span onclick="fillLogin('${esc(p.server)}','${esc(p.key)}')">${esc(p.name)}</span>`).join('');
  }
  const last=JSON.parse(localStorage.getItem('zyzu_last')||'null');
  if(last){document.getElementById('login-server').value=last.server||'';document.getElementById('login-key').value=last.key||'';}
  setInterval(()=>{if(server&&document.getElementById('app').style.display!=='none')loadStats()},3000);
}
async function doLogin(){
  const s=document.getElementById('login-server').value.trim();
  const k=document.getElementById('login-key').value.trim();
  if(!s){showErr('请输入服务器地址');return}
  server=s;key=k;
  loadLogs();
  try{
    const r=await fetch(server+'/health');
    if(!r.ok)throw new Error('HTTP '+r.status);
  }catch(e){showErr('连接失败: '+e.message);return}
  const saved=JSON.parse(localStorage.getItem(LS)||'[]');
  const name=server.replace(/https?:\/\//,'').split(':')[0];
  const exists=saved.findIndex(p=>p.server===server);
  if(exists>=0)saved.splice(exists,1);
  saved.unshift({name,server,key:k});if(saved.length>5)saved.length=5;
  localStorage.setItem(LS,JSON.stringify(saved));
  localStorage.setItem('zyzu_last',JSON.stringify({server,key:k}));
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('app-server').textContent=server;
  await Promise.all([loadStats(),loadStations(),loadConfig(),loadScheduledMessages()]);render();connectWS();
}
function fillLogin(s,k){
  document.getElementById('login-server').value=s;
  document.getElementById('login-key').value=k||'';
}
function logout(){
  if(ws)ws.close();
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
}
function showErr(m){const e=document.getElementById('login-err');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function loadStats(){
  if(!server)return;
  try{const r=await fetch(server+'/api/stations/stats').then(r=>r.json());if(r.ok){document.getElementById('s-total').textContent=r.data.total;document.getElementById('s-blocked').textContent=r.data.blacklisted;document.getElementById('s-posted').textContent=r.data.posted}
  const s=await fetch(server+'/api/status').then(r=>r.json());if(s.ok){const state=s.data.content_running?'下载/上传中':s.data.scrape_running?'采集中':'空闲';document.getElementById('s-running').textContent=state;const disk=s.data.disk||{};const diskEl=document.getElementById('s-disk');if(diskEl){diskEl.textContent=disk.ok?`${Number(disk.available_gb||0).toFixed(1)}G`:'-';diskEl.className='n '+(disk.low_space?'red':'')}if(disk.ok&&disk.low_space)addLog('warn',`磁盘剩余 ${Number(disk.available_gb||0).toFixed(1)}G，建议暂停大文件下载`,false);channelJobs=s.data.channel_jobs||{};renderChannelCards();renderChannelJobBoard();const modal=document.getElementById('channel-detail-modal'),current=document.getElementById('channel-current-job');if(current&&!modal.classList.contains('hidden'))current.textContent=channelJobText(modal.dataset.category)}}catch(e){}

  try{const r=await fetch(server+'/api/stations?all=1').then(r=>r.json());if(r.ok)stations=r.data;refreshChannelCategories();refreshStationCategoryFilter();renderChannelJobBoard()}catch(e){}
}
async function loadConfig(){
  try{const r=await fetch(server+'/api/config',{headers:{'X-API-Key':key}}).then(r=>r.json());
  if(r.ok&&r.data){const c=r.data;document.getElementById('cfg-token').value=c.bot_token||'';document.getElementById('cfg-scrape').value=c.scrape_cron||'';document.getElementById('cfg-content-cron').value=c.content_cron||'';document.getElementById('cfg-mode').value=c.content_mode||'video';document.getElementById('cfg-limit').value=c.content_limit||10;document.getElementById('cfg-video-format').value=c.video_format||'[资源码] {code}\n{title}\n分类：{category}\n来源：{source}';document.getElementById('cfg-separate-cover').checked=c.separate_cover!==false;videoFormats=c.video_formats||{};
  if(c.channel_map)channelMap=c.channel_map;else if(c.channel_ids)channelMap={default:c.channel_ids};else channelMap={};channelIntervals=c.channel_intervals||{};channelPolicies=c.channel_policies||{};refreshChannelCategories();renderChannelCards();renderChannelJobBoard()}}catch(e){}
 }
function defaultChannelInterval(category){if(['成人','adult','AV','av'].includes(category))return 15;if(['电视剧','电视','tv'].includes(category))return 30;if(['电影','movie'].includes(category))return 60;return 30}
function defaultChannelPolicy(category){const c=String(category||'').toLowerCase();if(['成人','adult','av'].includes(c))return{paused:false,per_run_limit:3,per_series_limit:1,allow_series:false};if(['电影','movie'].includes(c))return{paused:false,per_run_limit:1,per_series_limit:1,allow_series:false};if(['电视剧','电视','tv','动漫','anime','综艺','variety','纪录片','documentary'].includes(c))return{paused:false,per_run_limit:2,per_series_limit:3,allow_series:true};return{paused:false,per_run_limit:2,per_series_limit:2,allow_series:true}}
function channelPolicy(category){return Object.assign(defaultChannelPolicy(category),channelPolicies[category]||{})}
function channelJobText(category){const j=channelJobs[category];if(!j)return '等待调度';const labels={queued:'等待处理',downloading:'正在下载',uploading:'正在上传',retrying:'正在换源',completed:'最近完成',failed:'本轮失败'};const size=j.size_mb?` · ${Number(j.size_mb).toFixed(0)}MB`:'';return `${labels[j.state]||j.state}《${j.title||'未知资源'}》 · ${j.source||'未知来源'}${size}`}
function renderChannelJobBoard(){
  const el=document.getElementById('channel-job-board');if(!el)return;
  const cats=Object.keys(channelMap||{});
  if(!cats.length){el.innerHTML='';return}
  el.innerHTML=cats.map(cat=>{
    const j=channelJobs[cat]||{};
    const state=j.state||'idle';
    const cls=state==='failed'?'red':(state==='completed'?'green':'');
    const ids=(channelMap[cat]||[]).length,p=channelPolicy(cat);
    const bound=stations.filter(s=>(s.category||'综合影视')===cat).length;
    return `<div class="job-card"><h4>${esc(cat)} · ${ids} 个频道${p.paused?' · 已暂停':''}</h4><div class="state ${cls}">${esc(channelJobText(cat))}</div><div class="meta">绑定资源站 ${bound} 个 · 每 ${channelIntervals[cat]||defaultChannelInterval(cat)} 分钟检查 · 每轮 ${p.per_run_limit} 条</div></div>`;
  }).join('');
}
function refreshChannelCategories(){const el=document.getElementById('channel-category');if(!el)return;const current=el.value;const values=['成人','综合影视','电影','电视剧','动漫','综艺','纪录片',...Object.keys(channelMap||{}),...stations.map(s=>s.category||'')].filter(Boolean);const unique=[...new Set(values)];el.innerHTML=unique.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(unique.includes(current))el.value=current}
function refreshStationCategoryFilter(){const el=document.getElementById('station-category-filter');if(!el)return;const current=el.value;const values=stations.map(s=>s.category||'未分类').filter(Boolean);const unique=[...new Set(values)];el.innerHTML='<option value="">全部分类</option>'+unique.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(unique.includes(current))el.value=current}
function renderChannelCards(){const el=document.getElementById('channel-cards');if(!el)return;const rows=Object.entries(channelMap||{}).flatMap(([cat,ids])=>(ids||[]).map(id=>{const p=channelPolicy(cat);return `<div class="channel-card" onclick="openChannelDetail('${encodeURIComponent(String(cat))}','${encodeURIComponent(String(id))}')"><h4>${esc(cat)}${p.paused?' · 暂停':''}</h4><div class="channel-id">${esc(String(id))}</div><div style="margin-top:10px;color:#f2d8ff;line-height:1.5">${esc(channelJobText(cat))}</div><small style="display:block;color:#aaa;margin-top:8px">每 ${channelIntervals[cat]||defaultChannelInterval(cat)} 分钟 · 每轮 ${p.per_run_limit} 条 · 点击设置</small></div>`}));el.innerHTML=rows.length?rows.join(''):'<div class="channel-card" style="cursor:default">暂无频道，请添加</div>'}
async function loadScheduledMessages(){if(!server)return;try{const r=await fetch(server+'/api/scheduled-messages',{headers:{'X-API-Key':key}}).then(r=>r.json());scheduledMessages=r.ok&&Array.isArray(r.data)?r.data:[];renderScheduledMessages()}catch(e){scheduledMessages=[];renderScheduledMessages()}}
function scheduledChannelLabel(item){return `${item.channel_category} · ${item.channel_id}`}
function scheduledRuleLabel(item){return item.schedule_type==='daily'?`每天 ${item.daily_time}（北京时间）`:`每 ${item.interval_minutes} 分钟`}
function scheduledTime(value){return value?new Date(value).toLocaleString():'尚未执行'}
function renderScheduledMessages(){const el=document.getElementById('scheduled-cards');if(!el)return;el.innerHTML=scheduledMessages.length?scheduledMessages.map(item=>`<div class="schedule-card ${item.enabled?'':'disabled'}"><h4>${esc(scheduledChannelLabel(item))}</h4><div class="schedule-meta">${esc(scheduledRuleLabel(item))} · ${item.enabled?'已启用':'已暂停'}<br>下次：${esc(scheduledTime(item.next_run_at))}<br>最近：${esc(item.last_status||'等待发送')}${item.last_error?` · ${esc(item.last_error)}`:''}</div><div class="schedule-content">${esc(item.content)}</div><div class="schedule-actions"><button class="btn btn-g" onclick="sendScheduledMessage(${item.id})">立即发送</button><button class="btn btn-o" onclick="openScheduledModal(${item.id})">编辑</button><button class="btn btn-r" onclick="deleteScheduledMessage(${item.id})">删除</button></div></div>`).join(''):'<div class="empty-detail">还没有定时发言，点击“添加定时发言”开始配置</div>'}
function scheduledChannelOptions(selectedID){const select=document.getElementById('scheduled-channel');const rows=Object.entries(channelMap||{}).flatMap(([category,ids])=>(ids||[]).map(id=>({category,id})));select.innerHTML=rows.map(row=>`<option value="${row.id}" data-category="${esc(row.category)}">${esc(row.category)} · ${esc(String(row.id))}</option>`).join('');if(selectedID)select.value=String(selectedID)}
function openScheduledModal(id=0,channelID=0){const item=scheduledMessages.find(row=>row.id===Number(id));const modal=document.getElementById('scheduled-modal');modal.dataset.id=item?String(item.id):'';document.getElementById('scheduled-modal-title').textContent=item?'编辑定时发言':'添加定时发言';scheduledChannelOptions(item?.channel_id||channelID);document.getElementById('scheduled-content').value=item?.content||'';document.getElementById('scheduled-type').value=item?.schedule_type||'interval';document.getElementById('scheduled-interval').value=String(item?.interval_minutes||60);document.getElementById('scheduled-daily-time').value=item?.daily_time||'09:00';document.getElementById('scheduled-enabled').checked=item?.enabled!==false;toggleScheduledFields();modal.classList.remove('hidden')}

function toggleScheduledFields(){const daily=document.getElementById('scheduled-type').value==='daily';document.getElementById('scheduled-interval-wrap').classList.toggle('hidden',daily);document.getElementById('scheduled-daily-wrap').classList.toggle('hidden',!daily)}
async function saveScheduledMessage(){const modal=document.getElementById('scheduled-modal'),select=document.getElementById('scheduled-channel'),option=select.selectedOptions[0];if(!option){showToast('请先添加频道','err');return}const payload={channel_category:option.dataset.category,channel_id:Number(select.value),content:document.getElementById('scheduled-content').value,schedule_type:document.getElementById('scheduled-type').value,interval_minutes:Number(document.getElementById('scheduled-interval').value),daily_time:document.getElementById('scheduled-daily-time').value,enabled:document.getElementById('scheduled-enabled').checked};const id=Number(modal.dataset.id||0);await api(id?`/api/scheduled-messages/${id}`:'/api/scheduled-messages',id?'PUT':'POST',payload);await loadScheduledMessages();closeScheduledModal()}
async function deleteScheduledMessage(id){if(!window.confirm('确定删除这条定时发言吗？'))return;await api(`/api/scheduled-messages/${id}`,'DELETE');await loadScheduledMessages()}
async function sendScheduledMessage(id){await api(`/api/scheduled-messages/${id}/send`,'POST');showToast('已加入发送队列','info');setTimeout(loadScheduledMessages,2500)}
function addScheduledForChannel(category,id){closeChannelDetail();switchTab('scheduled');openScheduledModal(0,Number(id))}
function defaultVideoFormatFor(category){
  try{category=decodeURIComponent(category)}catch(e){}
  const c=String(category||'').toLowerCase();
  if(['成人','adult','av'].includes(c))return '{title}\n\n简介：{intro}\n标签：{class}\n演员：{actor}\n时长：{duration}\n更新：{updated_at}';
  if(['电影','movie'].includes(c))return '{title}\n\n简介：{intro}\n类型：{type} / {class}\n主演：{actor}\n地区：{area}\n年份：{year}\n状态：{remarks}\n更新：{updated_at}';
  if(['电视剧','电视','tv'].includes(c))return '{title} · {episode}\n\n简介：{intro}\n类型：{type} / {class}\n主演：{actor}\n地区：{area}\n年份：{year}\n进度：第 {episode_index} / {episode_total} 集\n状态：{remarks}\n更新：{updated_at}';
  if(['动漫','anime'].includes(c))return '{title} · {episode}\n\n简介：{intro}\n标签：{tags}\n地区：{area}\n年份：{year}\n进度：第 {episode_index} / {episode_total} 集\n状态：{remarks}\n更新：{updated_at}';
  if(['综艺','variety'].includes(c))return '{title} · {episode}\n\n简介：{intro}\n嘉宾：{actor}\n标签：{tags}\n地区：{area}\n年份：{year}\n进度：第 {episode_index} / {episode_total} 期\n状态：{remarks}\n更新：{updated_at}';
  if(['纪录片','documentary'].includes(c))return '{title} · {episode}\n\n简介：{intro}\n类型：{type} / {class}\n地区：{area}\n年份：{year}\n进度：第 {episode_index} / {episode_total} 集\n时长：{duration}\n更新：{updated_at}';
  return document.getElementById('cfg-video-format')?.value||'{title}\n\n简介：{intro}\n类型：{type} / {class}\n标签：{tags}\n演员：{actor}\n地区：{area}\n年份：{year}\n状态：{remarks}\n更新：{updated_at}';
}
function videoVariablesFor(category){
  const base=[['{title}','标题'],['{intro}','简介'],['{category}','频道分类'],['{type}','接口类型'],['{class}','标签/子类'],['{remarks}','备注'],['{duration}','时长'],['{updated_at}','更新时间']];
  const c=String(category||'').toLowerCase();
  if(['成人','adult','av'].includes(c))return [...base,[ '{actor}','演员' ],[ '{code}','番号/资源ID' ],[ '{tags}','标签组' ]];
  if(['电影','movie'].includes(c))return [...base,[ '{actor}','主演' ],[ '{director}','导演' ],[ '{area}','地区' ],[ '{language}','语言' ],[ '{year}','年份' ],[ '{score}','评分' ],[ '{tags}','标签组' ]];
  if(['电视剧','电视','tv','动漫','anime','综艺','variety','纪录片','documentary'].includes(c))return [...base,[ '{episode}','集名/期名' ],[ '{episode_index}','当前集序号' ],[ '{episode_total}','总集数' ],[ '{actor}','主演/嘉宾' ],[ '{director}','导演' ],[ '{area}','地区' ],[ '{language}','语言' ],[ '{year}','年份' ],[ '{score}','评分' ],[ '{tags}','标签组' ]];

}
function variableButtons(category){
  return videoVariablesFor(category).map(v=>`<button class="btn btn-o" type="button" onclick="insertVideoVariable('${v[0]}')" title="${esc(v[1])}">${esc(v[0])}</button>`).join('');
}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
function healthClass(score){score=Number(score||0);if(score>=85)return'health-good';if(score>=65)return'health-ok';if(score>=40)return'health-watch';return'health-bad'}
function healthText(s){const score=Number(s.health_score||0);const label=s.health_label||'未知';return `${label} ${score}${s.download_cooldown?' · 冷却中':''}`}
function insertVideoVariable(token){
  const el=document.getElementById('channel-video-format');if(!el)return;
  const start=el.selectionStart||0,end=el.selectionEnd||0;
  el.value=el.value.slice(0,start)+token+el.value.slice(end);
  el.focus();el.selectionStart=el.selectionEnd=start+token.length;
}

ss="empty-detail">正在加载候选资源...</div></div></div><div class="detail-section"><h4>视频资源文案</h4><div class="config-form"><textarea id="channel-video-format" rows="8">${esc(videoFormat)}</textarea><div class="toolbar" style="margin:8px 0 0">${variableButtons(category)}</div><small style="color:#999">简介为空时，包含 {intro} 的整行会自动隐藏。封面由资源站封面字段生成，不需要写进文案。</small><div style="margin-top:10px"><button class="btn btn-p" onclick="saveChannelVideoFormat()">保存文案</button><button class="btn btn-o" onclick="document.getElementById('channel-video-format').value=defaultVideoFormatFor('${encodeURIComponent(category)}')">恢复推荐模板</button></div></div></div><div class="detail-section"><h4>定时发言</h4><div class="detail-row">已配置 ${scheduledCount} 条频道独立文案 <button class="btn btn-p" style="float:right" onclick="addScheduledForChannel('${encodeURIComponent(category)}','${encodeURIComponent(id)}')">添加文案</button></div></div><div class="detail-section"><h4>绑定资源站（按此分类自动推送）</h4><div class="detail-list">${bound.length?bound.map(s=>`<div class="detail-row">${esc(s.name)} <span style="color:#888">· ${esc(s.resource_count||'暂无资源')}</span></div>`).join(''):'<div class="empty-detail">暂无同分类资源站，请在资源站页修改分类</div>'}</div></div><div class="detail-section"><h4>最近推送记录</h4><div class="detail-list" id="channel-history"><div class="empty-detail">正在加载...</div></div></div>`;

  const el=document.getElementById('channel-preview');if(!el)return;const items=contentPreviews[category]||[];
  if(!items.length){el.innerHTML='<div class="empty-detail">暂时没有可推送候选资源</div>';return}
  el.innerHTML=items.map((item,i)=>`<div class="resource-card" onclick="openResourceDetail('${encodeURIComponent(category)}',${i})">${item.cover_url?`<img src="${escAttr(item.cover_url)}">`:'<div></div>'}<div><h5>${esc(item.title||'未命名资源')}</h5><small>${esc(item.source||'未知资源站')} · ${esc(item.type_name||item.category||'未分类')} · ${item.episode_count||0} 集<br>${esc(item.remarks||item.vod_time||'')}</small></div><span class="${item.posted?'green':item.skipped?'red':''}">${item.posted?'已发':item.skipped?'已跳过':'待发'}</span></div>`).join('');
}
function openResourceDetail(category,index){
  category=decodeURIComponent(category);const item=(contentPreviews[category]||[])[index];if(!item)return;
  document.getElementById('resource-title').textContent=item.title||'资源详情';
  document.getElementById('resource-body').innerHTML=`${item.cover_url?`<img class="cover-preview" src="${escAttr(item.cover_url)}">`:''}<div class="detail-grid"><div class="detail-item"><small>来源</small><b>${esc(item.source||'-')}</b></div><div class="detail-item"><small>分类</small><b>${esc(item.category||'-')}</b></div><div class="detail-item"><small>类型/标签</small><b>${esc([item.type_name,item.class].filter(Boolean).join(' / ')||'-')}</b></div><div class="detail-item"><small>集数</small><b>${item.episode_count||0}</b></div><div class="detail-item"><small>年份</small><b>${esc(item.year||'-')}</b></div><div class="detail-item"><small>状态</small><b>${item.posted?'已推送':item.skipped?'已跳过':'待推送'}</b></div></div><div class="detail-section"><h4>简介</h4><div class="detail-row" style="white-space:pre-wrap">${esc(item.intro||'暂无简介')}</div></div><div class="detail-section"><h4>演员/备注</h4><div class="detail-row">${esc(item.actor||item.remarks||'暂无')}</div></div><div class="detail-section"><h4>资源站接口</h4><div class="detail-row" style="word-break:break-all">${esc(item.source_url||'')}</div></div>`;
  document.getElementById('resource-modal').classList.remove('hidden');
}
function closeResourceModal(){document.getElementById('resource-modal').classList.add('hidden')}
function closeChannelDetail(){document.getElementById('channel-detail-modal').classList.add('hidden')}
async function deleteChannelFromDetail(){
  const modal=document.getElementById('channel-detail-modal'),category=modal.dataset.category,id=Number(modal.dataset.id);
  if(!category||!id)return;
  if(!window.confirm(`确定删除“${category}”频道吗？`))return;
  await api('/api/channels','DELETE',{category,id});
  await loadConfig();
  renderChannelCards();
  closeChannelDetail();
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const categoryFilter=document.getElementById('station-category-filter').value;
  const sb=document.getElementById('show-blocked').checked;
  const filtered=stations.filter(s=>(sb||!s.blacklisted)&&(!categoryFilter||((s.category||'未分类')===categoryFilter))&&(!q||s.name.toLowerCase().includes(q)||(s.api_url||'').toLowerCase().includes(q)));
  const totalPages=Math.max(1,Math.ceil(filtered.length/stationPageSize));stationPage=Math.min(Math.max(1,stationPage),totalPages);
  const pageItems=filtered.slice((stationPage-1)*stationPageSize,stationPage*stationPageSize);
  document.getElementById('station-page-info').textContent=`第 ${stationPage} / ${totalPages} 页 · 共 ${filtered.length} 个`;
  document.getElementById('station-list').innerHTML=pageItems.map(s=>{
    const slug=encodeURIComponent(s.slug);
    const category=esc(s.category||'未分类');
    const healthTip=s.last_download_error?` title="${escAttr(s.last_download_error)}"`:'';
    return `<tr class="${s.blacklisted?'blocked':''}"><td><b>${esc(s.name)}</b><br><small>${esc(s.api_url||'').substring(0,45)}</small></td><td><span class="category-badge">${category}</span></td><td><span class="health-badge ${healthClass(s.health_score)}"${healthTip}>${esc(healthText(s))}</span></td><td>${s.resource_count||'-'}条</td><td class="${parseFloat(s.availability)>=50?'green':'red'}">${s.availability||'-'}</td><td>${s.response_time||'-'}</td><td><button class="btn btn-o" onclick="api('/api/stations/${slug}/post','POST')">推送</button> <button class="btn btn-o" onclick="probeStation('${slug}')">测活</button> <button class="btn btn-o" onclick="editCategory('${slug}')">分类</button> <button class="btn ${s.blacklisted?'btn-g':'btn-r'}" onclick="api('/api/stations/${slug}/blacklist','POST',{blacklisted:!s.blacklisted})">${s.blacklisted?'解除':'屏蔽'}</button></td></tr>`;
  }).join('');
}
function changeStationPage(delta){stationPage+=delta;render()}
async function probeStation(slug){addLog('info','Probing '+slug+'...');await api('/api/stations/'+encodeURIComponent(slug)+'/probe','POST');}
function editCategory(slug){
  const station=stations.find(s=>s.slug===decodeURIComponent(slug)||s.slug===slug);if(!station)return;
  const values=['成人','综合影视','电影','电视剧','动漫','综艺','纪录片',...Object.keys(channelMap||{}),...stations.map(s=>s.category||'')].filter(Boolean);
  const categories=[...new Set(values)];
  const select=document.getElementById('station-category-select');
  select.innerHTML=categories.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(categories.includes(station.category||'综合影视'))select.value=station.category||'综合影视';
  document.getElementById('category-station-name').textContent=station.name;
  document.getElementById('category-modal').dataset.slug=station.slug;
  document.getElementById('category-modal').classList.remove('hidden');
}
function closeCategoryModal(){document.getElementById('category-modal').classList.add('hidden')}
async function saveStationCategory(){
  const modal=document.getElementById('category-modal'),slug=modal.dataset.slug,category=document.getElementById('station-category-select').value;
  if(!slug||!category)return;
  await api('/api/stations/'+encodeURIComponent(slug)+'/category','POST',{category});
  closeCategoryModal();
}
async function api(path,method='GET',body=null){
  const opts={method,headers:{}};if(key)opts.headers['X-API-Key']=key;
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
  try{const response=await fetch(server+path,opts);const r=await response.json();
  if(r.ok){const msg=`操作成功：${method} ${path}`;addLog('ok',msg);showToast(msg,'ok');await loadStats();await loadStations();render();}else {const msg=`${path} -> ${r.error||('HTTP '+response.status)}`;addLog('err',msg);showToast(msg,'err');}}catch(e){const msg=`${path} -> ${e.message}`;addLog('err',msg);showToast(msg,'err')}
}
async function saveChannels(){
  try{await api('/api/config','PUT',{channel_map:channelMap});addLog('ok','频道设置已保存')}catch(e){addLog('err','频道保存失败: '+e.message)}
}
async function addChannel(){const category=document.getElementById('channel-category').value.trim();const id=Number(document.getElementById('channel-id').value);if(!category||!id){addLog('err','请输入分类和频道 ID');return}if(!videoFormats[category])videoFormats[category]=defaultVideoFormatFor(category);await api('/api/channels','POST',{category,id});await api('/api/config','PUT',{video_format:document.getElementById('cfg-video-format').value,video_formats:videoFormats});await loadConfig();}
async function removeChannel(){const category=document.getElementById('channel-category').value.trim();const id=Number(document.getElementById('channel-id').value);if(!category||!id){addLog('err','请输入分类和频道 ID');return}await api('/api/channels','DELETE',{category,id});await loadConfig();}
async function saveConfig(){
  await api('/api/config','PUT',{
    bot_token:document.getElementById('cfg-token').value,
    scrape_cron:document.getElementById('cfg-scrape').value,
    content_cron:document.getElementById('cfg-content-cron').value,
    content_mode:document.getElementById('cfg-mode').value,
    content_limit:parseInt(document.getElementById('cfg-limit').value)||10
    ,separate_cover:document.getElementById('cfg-separate-cover').checked
    ,video_format:document.getElementById('cfg-video-format').value
    ,video_formats:videoFormats
  });
}
async function telethonRequestCode(){const phone=document.getElementById('telethon-phone').value.trim();if(!phone){addLog('err','请输入手机号');return}await api('/api/telethon/request-code','POST',{phone});}
async function telethonLogin(){const phone=document.getElementById('telethon-phone').value.trim(),code=document.getElementById('telethon-code').value.trim(),password=document.getElementById('telethon-password').value;if(!phone||!code){addLog('err','请输入手机号和验证码');return}await api('/api/telethon/login','POST',{Phone:phone,Code:code,Password:password});telethonStatus();}
async function telethonStatus(){try{const r=await fetch(server+'/api/telethon/status',{headers:{'X-API-Key':key}}).then(r=>r.json());document.getElementById('telethon-status').textContent=r.ok?'已授权':'未授权'}catch(e){document.getElementById('telethon-status').textContent='检查失败'}}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(t=>t.classList.add('hidden'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.remove('hidden');
  if(name==='channels')loadConfig();
  if(name==='scheduled')loadScheduledMessages();
}
function logStorageKey(){return LOG_PREFIX+(server||'unknown')}
async function loadLogs(){try{const r=await fetch(server+'/api/event-log').then(r=>r.json());if(r.ok&&Array.isArray(r.data)){logEntries=r.data.map(x=>({type:x.level,msg:x.message,time:new Date(x.created_at).toLocaleTimeString(),at:new Date(x.created_at).getTime()}));renderLogs();return}}catch(e){}try{logEntries=JSON.parse(localStorage.getItem(logStorageKey())||'[]');if(!Array.isArray(logEntries))logEntries=[]}catch(e){logEntries=[]}renderLogs()}
function persistLogs(){try{localStorage.setItem(logStorageKey(),JSON.stringify(logEntries.slice(-200)))}catch(e){}}
function addLog(type,msg,popup=true){logEntries.push({type,msg,time:new Date().toLocaleTimeString(),at:Date.now()});if(logEntries.length>200)logEntries.shift();persistLogs();renderLogs();if(popup)showToast(msg,type==='err'?'err':type==='ok'?'ok':'info');if(server){fetch(server+'/api/event-log',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':key},body:JSON.stringify({level:type,message:msg})}).catch(()=>{})}}
function renderLogs(){const el=document.getElementById('log-el');if(!el)return;const filter=document.getElementById('log-filter')?.value||'all';el.innerHTML=logEntries.filter(x=>filter==='all'||x.type===filter).map(x=>`<div><span class="ts">${esc(x.time)}</span> <span class="${x.type}">${esc(x.msg)}</span></div>`).join('');el.scrollTop=el.scrollHeight}
async function clearLogs(){try{await fetch(server+'/api/event-log',{method:'DELETE',headers:{'X-API-Key':key}})}catch(e){}logEntries=[];persistLogs();renderLogs()}
function showToast(msg,type='info'){const area=document.getElementById('toast-area');if(!area)return;const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;area.appendChild(el);setTimeout(()=>el.remove(),4500)}
function connectWS(){
  const u=new URL(server);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname='/ws';if(key)u.searchParams.set('api_key',key);
  ws=new WebSocket(u.toString());
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    switch(msg.type){
      case'scrape_triggered':addLog('info','采集已启动');break;
      case'scrape_complete':addLog('ok',`采集完成： ${msg.data.new_count||0}新增 ${msg.data.upd_count||0}更新 `);loadStats();break;
      case'content_triggered':addLog('info','内容抓取已启动');break;
      case'manual_post':addLog('ok',`已推送 ${msg.data.name}，消息 #${msg.data.message_id}`);break;
      case'blacklist_changed':addLog('info',`${msg.data.slug}： ${msg.data.blacklisted?'已屏蔽':'已解除屏蔽'}`);loadStats();loadStations();render();break;
      case'config_updated':addLog('ok','配置已更新');loadConfig();break;
      case'scheduled_message_changed':loadScheduledMessages();break;
      case'scheduled_message_sent':addLog(msg.data.status==='sent'?'ok':'err',msg.data.status==='sent'?'定时发言发送成功':'定时发言发送失败');loadScheduledMessages();break;
    }
  };
  ws.onclose=()=>setTimeout(connectWS,3000);
}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
init();
</script>
</body>
